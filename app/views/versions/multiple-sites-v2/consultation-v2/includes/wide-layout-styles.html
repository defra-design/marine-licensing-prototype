    max-width: 1920px;
    margin-left: 15px;
    margin-right: 15px;

    .page-consultation-full-width .govuk-header__container {
      margin-left: 30px;
      margin-right: 30px;

  }
  @media (min-width: 1980px) {
    .page-consultation-full-width .govuk-width-container,
    .page-consultation-full-width .govuk-header__container {
