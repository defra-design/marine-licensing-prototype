{# MOJ contextual date styles (?deadline=bar), shared by the list and the
   request page so both show the same #}
<style>
    /* Label 16px under the date, as the MOJ contextual date asks */
    .app-closing__label { display: block; font-size: 16px; color: #0b0c0c; }
    /* MOJ contextual date: red bar to the left of the bold date and label.
       GOV.UK red #ca3535 has over 3:1 contrast with white, so the bar is
       visible enough; the label gives it its meaning. Red for passed and up
       to 2 days. */
    .app-closing--bar { display: block; border-left: 5px solid #ca3535; padding-left: 10px; }
    /* 3 to 7 days: GOV.UK primary orange. Only 2.78:1 on white, under the
       3:1 for graphics, but the label carries the meaning. Shade 25% passed
       (4.69:1) but could not be told apart from the red. */
    .app-closing--bar.app-closing--soon { border-left-color: #f47738; }
</style>
