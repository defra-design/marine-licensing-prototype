{#
  Shared webmail top bar. Included from the header block of inbox.html and of
  each email page, so the chrome stays visible when a message is open.
#}

<style>
  .mail__topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: #1f3a5f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .mail__brand {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.2px;
    white-space: nowrap;
  }
  .mail__brand a {
    color: #fff;
    text-decoration: none;
  }
  .mail__search {
    flex: 1 1 auto;
    max-width: 520px;
    border: 0;
    border-radius: 4px;
    padding: 7px 12px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: #333;
  }
  .mail__avatar {
    margin-left: auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #6a8fb8;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  @media (max-width: 640px) {
    .mail__brand {
      font-size: 15px;
    }
  }
</style>

<div class="mail__topbar">
  <span class="mail__brand"><a href="{{ inboxHref }}">Mail</a></span>
  <input class="mail__search" type="text" placeholder="Search mail" aria-label="Search mail">
  <span class="mail__avatar">SE</span>
</div>
