{#
  Shared inbox styles - folder rail and message list.
  Included by inbox-transfer.html and inbox-reject.html.
#}

<style>
  body, .govuk-template__body {
    background: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .govuk-width-container,
  .govuk-main-wrapper {
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .mail {
    background: #fff;
  }

  /* Body — fills what is left below the shared top bar */
  .mail__body {
    display: flex;
    height: calc(100vh - 53px);
    min-height: 0;
  }

  /* Folder rail */
  .mail__rail {
    flex: 0 0 220px;
    background: #fafafa;
    border-right: 1px solid #e3e4e6;
    padding: 16px 0;
    overflow-y: auto;
  }
  .mail__account {
    padding: 0 16px 14px;
    border-bottom: 1px solid #e3e4e6;
    margin-bottom: 10px;
  }
  .mail__account-name {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
  }
  .mail__account-org {
    font-size: 12px;
    color: #6b6f76;
    margin-top: 2px;
  }
  .mail__folders {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .mail__folder {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    font-size: 14px;
    color: #333;
  }
  .mail__folder--current {
    background: #e6ecf3;
    font-weight: 600;
    box-shadow: inset 3px 0 0 #1f3a5f;
  }
  .mail__folder-count {
    font-size: 12px;
    font-weight: 600;
    color: #1f3a5f;
  }

  /* Message list */
  .mail__list {
    flex: 1 1 auto;
    overflow-y: auto;
    min-width: 0;
  }
  .mail__list-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px 20px 10px;
    border-bottom: 1px solid #e3e4e6;
  }
  .mail__list-header h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    color: #1a1a1a;
  }
  .mail__list-header span {
    font-size: 13px;
    color: #6b6f76;
  }

  .mail__msg {
    display: block;
    text-decoration: none;
    color: inherit;
    border-bottom: 1px solid #eceef0;
    padding: 12px 20px 12px 34px;
    position: relative;
    cursor: default;
  }
  a.mail__msg {
    cursor: pointer;
  }
  a.mail__msg:hover {
    background: #f5f8fb;
  }
  a.mail__msg:focus {
    outline: 3px solid #ffdd00;
    outline-offset: -3px;
    background: #ffdd00;
  }
  .mail__msg--unread::before {
    content: "";
    position: absolute;
    left: 16px;
    top: 18px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1f6fd4;
  }
  .mail__msg-top {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .mail__msg-from {
    font-size: 14px;
    color: #1a1a1a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mail__msg-date {
    margin-left: auto;
    font-size: 12px;
    color: #6b6f76;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .mail__msg-subject {
    font-size: 14px;
    color: #1a1a1a;
    margin-top: 2px;
  }
  .mail__msg-preview {
    font-size: 13px;
    color: #6b6f76;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mail__msg--unread .mail__msg-from,
  .mail__msg--unread .mail__msg-subject {
    font-weight: 700;
  }
  .mail__msg--unread .mail__msg-date {
    color: #1f6fd4;
    font-weight: 600;
  }

  @media (max-width: 640px) {
    .mail__rail {
      display: none;
    }
    .mail__brand {
      font-size: 15px;
    }
  }
</style>
