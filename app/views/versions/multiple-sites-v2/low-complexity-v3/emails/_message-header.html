{#
  The mail client's message header, shown above the email itself.
  Set messageSubject and messageDate before including.
#}

<style>
  .msg-head {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 15px 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    border-bottom: 1px solid #e3e4e6;
  }
  .msg-head__back {
    font-size: 14px;
    margin-bottom: 16px;
  }
  .msg-head__back a {
    color: #1f6fd4;
  }
  .msg-head__row {
    display: flex;
    gap: 12px;
  }
  .msg-head__avatar {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #6a8fb8;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .msg-head__detail {
    flex: 1 1 auto;
    min-width: 0;
  }
  .msg-head__from {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .msg-head__sender {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .msg-head__date {
    margin-left: auto;
    font-size: 13px;
    color: #6b6f76;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .msg-head__subject {
    font-size: 15px;
    color: #1a1a1a;
    margin-top: 2px;
  }
  .msg-head__meta {
    font-size: 13px;
    color: #6b6f76;
    margin-top: 4px;
  }
  .msg-head__meta span {
    color: #1a1a1a;
  }
</style>

<div class="msg-head">
  <p class="msg-head__back"><a href="inbox">Back to inbox</a></p>
  <div class="msg-head__row">
    <span class="msg-head__avatar">MMO</span>
    <div class="msg-head__detail">
      <div class="msg-head__from">
        <span class="msg-head__sender">Marine Management Organisation (MMO)</span>
        <span class="msg-head__date">{{ messageDate }}</span>
      </div>
      <div class="msg-head__subject">{{ messageSubject }}</div>
      <div class="msg-head__meta">To: <span>Sam Evans</span></div>
      <div class="msg-head__meta">Reply-To: <span>marine.consents@marinemanagement.org.uk</span></div>
    </div>
  </div>
</div>
