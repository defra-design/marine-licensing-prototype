{% extends "layouts/main.html" %}

{% set pageName="Prototype journeys" %}

{% block beforeContent %}

{% endblock %}

{% block content %}

<div class="govuk-grid-row">

    <div class="govuk-grid-column-two-thirds">

        <h1 class="govuk-heading-l">
          Prototype journeys
        </h1>

        <ul class="govuk-list">
          <li><a class="govuk-link" href="/versions/multiple-sites-v2/low-complexity-v4/emails/inbox-rejected?organisation-name=Southwest%20Marine%20Works%20Ltd&user_type=organisation">Journey 1</a></li>

          <li><a class="govuk-link" href="/versions/multiple-sites-v2/low-complexity-v4/emails/inbox-site-notice?organisation-name=Southwest%20Marine%20Works%20Ltd&user_type=organisation">Journey 2</a></li>

          <li><a class="govuk-link" href="/versions/multiple-sites-v2/low-complexity-v4/emails/inbox-site-notice-resubmit?organisation-name=Southwest%20Marine%20Works%20Ltd&user_type=organisation">Journey 3</a></li>

          <li><a class="govuk-link" href="/versions/multiple-sites-v2/low-complexity-v4/emails/inbox-withhold-information?organisation-name=Southwest%20Marine%20Works%20Ltd&user_type=organisation">Journey 4</a></li>
        </ul>

        <form action="/user-testing-links/clear-data" method="post">
          <span class="govuk-!-margin-top-4" style="position:relative; display:inline-block;">
            <button type="submit" id="clear-data-button" class="govuk-button govuk-button--secondary" style="margin-top:0;" data-module="govuk-button">
              Clear data
            </button>
            <span id="clear-data-confirm" role="status" aria-live="polite" style="display:none; position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:8px; white-space:nowrap; background:#0f7a52; color:#ffffff; padding:4px 8px; border-radius:3px; font-family:'GDS Transport', arial, sans-serif; font-size:16px; font-weight:400;">Data cleared</span>
          </span>
        </form>

        <script>
          (function () {
            var button = document.getElementById('clear-data-button');
            var confirm = document.getElementById('clear-data-confirm');
            if (!button) return;
            button.addEventListener('click', function (e) {
              e.preventDefault();
              fetch('/user-testing-links/clear-data', { method: 'POST' }).then(function () {
                confirm.style.display = 'block';
                setTimeout(function () { confirm.style.display = 'none'; }, 1000);
              });
            });
          })();
        </script>

</div>





{% endblock %}
