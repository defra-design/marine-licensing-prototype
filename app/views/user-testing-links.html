            var button = document.getElementById('clear-data-button');
            var confirm = document.getElementById('clear-data-confirm');
            if (!button) return;
            button.addEventListener('click', function (e) {
              e.preventDefault();
              fetch('/user-testing-links/clear-data', { method: 'POST' }).then(function () {
                confirm.style.display = 'block';
                setTimeout(function () { confirm.style.display = 'none'; }, 1000);
              });
            });
          })();
        </script>

</div>





{% endblock %}
